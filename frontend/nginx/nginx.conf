# =============================================================================
# Nginx da SPA (Fase 7). Serve os estaticos e faz reverse-proxy de /api ->
# backend:8000 (mesma origem => zero CORS; backend nao exposto, §2.1.1/§4.1).
# =============================================================================

# Chave vazia nao consome a zona: somente o login entra no limitador. O Nginx
# enxerga o cliente antes do proxy e compartilha este estado entre workers.
map $uri $agenda_login_limit_key {
    default "";
    /api/v1/auth/login $binary_remote_addr;
}

# Cabecalho condicional: respostas da API recebem no-store, estaticos nao.
map $uri $agenda_api_cache_control {
    default "";
    ~^/api/ "no-store, private";
}

# Informa ao cliente quando repetir apenas nas rejeicoes do limitador.
map $status $agenda_retry_after {
    default "";
    429 "60";
}

limit_req_zone $agenda_login_limit_key zone=agenda_login:1m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Defesa antes do parser multipart: 20 MiB uteis + pequena margem do envelope.
    client_max_body_size 21m;

    # O backend e a borda marcam toda resposta /api/ como `no-store, private`
    # (§0.3), inclusive login, erros upstream e 429 local. Cabecalhos de
    # seguranca minimos; CSP restritiva (SPA sem terceiros).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Cache-Control $agenda_api_cache_control always;
    add_header Retry-After $agenda_retry_after always;

    # API -> backend (mesma rede docker). Mantem cookies/credenciais.
    location /api/ {
        # Cinco tentativas imediatas; depois, 429 ate o balde drenar. Rejeicoes
        # viram warning no stderr do Nginx sem registrar usuario ou senha.
        limit_req zone=agenda_login burst=4 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://backend:8000;
        # A borda reaplica uma unica politica, inclusive para erros gerados aqui.
        proxy_hide_header Cache-Control;
        # Upload clinico segue em fluxo; Nginx nao persiste o corpo original em temp.
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;    # geracao LLM pode demorar (Fase 6)
    }

    # SPA: qualquer rota desconhecida cai no index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
